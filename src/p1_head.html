<title>mars'up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: site vitrine en colonne gauche, téléphone sticky à droite, admin pleine largeur en bas. */
:root{
  --blue:#0F6BFF; --blue-2:#3B8BFF; --sea:#35B6FF; --navy:#07234F; --navy-2:#0C3473;
  --sky:#EAF2FF; --sky-2:#D9E8FF;
  --logo-full:block; --logo-alt:none;
  --bg:#F5F8FD; --surface:#FFFFFF; --surface-2:#F0F5FD; --line:#DCE6F5;
  --ink:#0B1A33; --ink-2:#4A5B78; --ink-3:#8696B3;
  --good:#1BA672; --warn:#E39A1C; --bad:#E04E4E;
  --on-blue:#FFFFFF;
  --shadow:0 12px 32px rgba(7,35,79,.10); --shadow-sm:0 4px 14px rgba(7,35,79,.08);
  --bezel:#0B1220;
  --fd:'Outfit',system-ui,sans-serif; --fb:'Manrope',system-ui,sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --blue:#4A90FF; --blue-2:#6AA6FF; --sea:#4FC3FF; --navy:#0B1E42; --navy-2:#122C5C;
  --sky:#122A52; --sky-2:#163567;
  --bg:#07101F; --surface:#0E1A30; --surface-2:#132240; --line:#1E2F4F;
  --ink:#EEF3FC; --ink-2:#A9B8D3; --ink-3:#6F82A6;
  --shadow:0 12px 32px rgba(0,0,0,.35); --shadow-sm:0 4px 14px rgba(0,0,0,.3); --bezel:#1A2438;
  --logo-full:none; --logo-alt:flex;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --blue:#4A90FF; --blue-2:#6AA6FF; --sea:#4FC3FF; --navy:#0B1E42; --navy-2:#122C5C;
  --sky:#122A52; --sky-2:#163567;
  --bg:#07101F; --surface:#0E1A30; --surface-2:#132240; --line:#1E2F4F;
  --ink:#EEF3FC; --ink-2:#A9B8D3; --ink-3:#6F82A6;
  --shadow:0 12px 32px rgba(0,0,0,.35); --shadow-sm:0 4px 14px rgba(0,0,0,.3); --bezel:#1A2438;
  --logo-full:none; --logo-alt:flex;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wordmark{font-family:var(--fd);font-weight:800;font-style:italic;letter-spacing:-.04em;color:var(--navy)}
.wordmark .apos{color:var(--navy)}
.wordmark .up{color:var(--blue)}
.mark{aspect-ratio:571/363;width:auto!important}
.logo-full{display:var(--logo-full,block);width:min(300px,100%);aspect-ratio:822/709;height:auto}
.hero-logo-alt{display:var(--logo-alt,none);align-items:center;gap:14px}
.hero-logo-alt .mark{height:56px}
.hero-logo-alt .wordmark{font-size:38px}
.brand{display:inline-flex;align-items:center;gap:10px}
.brand .mark{height:30px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.eyebrow{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}

/* ---------- Site ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.topbar nav{display:flex;gap:20px;margin-left:auto;font-weight:600;color:var(--ink-2);font-size:14px}
.topbar nav a:hover{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;font-family:var(--fd);font-size:15px;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:var(--on-blue);box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 35%,transparent)}
.btn-primary:hover{background:var(--blue-2)}
.btn-ghost{background:var(--sky);color:var(--blue)}
.btn-outline{border:1.5px solid var(--line);color:var(--ink)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%}
.site{max-width:1240px;margin:0 auto;padding:0 24px 48px}
.site-grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:48px;align-items:start}
.site-col{min-width:0;display:flex;flex-direction:column;gap:88px;padding-top:56px}
section{scroll-margin-top:90px}
.hero h1{font-size:clamp(38px,5vw,64px);font-weight:800;color:var(--navy);letter-spacing:-.03em;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .lede{font-size:19px;color:var(--ink-2);max-width:34rem;margin-top:20px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .proof{display:flex;flex-wrap:wrap;gap:22px;margin-top:36px;color:var(--ink-2);font-size:14px}
.hero .proof b{display:block;font-family:var(--fd);font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums}
.hero-logo{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.hero-logo .wordmark{font-size:38px}
.wave-rule{height:14px;width:120px;margin:28px 0 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.section-head h2{font-size:clamp(26px,3vw,36px);color:var(--navy)}
.section-head p{color:var(--ink-2);margin-top:8px;max-width:38rem}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.step .n{font-family:var(--fd);font-weight:800;font-size:13px;color:var(--blue);letter-spacing:.1em}
.step h3{font-size:20px;margin:10px 0 8px;color:var(--navy)}
.step p{color:var(--ink-2);font-size:14px}
.step .glyph{width:48px;height:48px;border-radius:14px;background:var(--sky);color:var(--blue);display:grid;place-items:center;margin-bottom:14px}
.pop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pop-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s}
.pop-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pop-card .scene{height:150px}
.pop-card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.pop-card h3{font-size:18px;color:var(--navy)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.sec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec-item{display:flex;gap:12px;padding:16px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.sec-item .ico{color:var(--blue);margin-top:2px}
.sec-item b{display:block;font-family:var(--fd);color:var(--navy)}
.sec-item span{font-size:13px;color:var(--ink-2)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.flow div{background:var(--navy);color:#fff;border-radius:var(--r-sm);padding:14px;font-size:13px;position:relative}
.flow div b{display:block;font-family:var(--fd);font-size:14px;margin-bottom:4px;color:var(--sea)}
.flow div:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:0;height:0;border:5px solid transparent;border-left-color:var(--navy);transform:translateY(-50%)}

/* ---------- Phone ---------- */
.phone-col{position:sticky;top:84px;padding-top:36px}
.phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 150px));min-height:620px;margin:0 auto;background:var(--bezel);border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(7,35,79,.28),inset 0 0 0 2px #2a3550;position:relative}
.phone::before{content:"";position:absolute;left:50%;top:22px;transform:translateX(-50%);width:110px;height:30px;background:var(--bezel);border-radius:999px;z-index:5}
.app{position:relative;height:100%;background:var(--bg);border-radius:42px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.status{height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-family:var(--fd);font-weight:700;font-size:14px;color:var(--ink)}
.status.light{color:#fff}
.status .right{display:flex;gap:5px;align-items:center}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:72px;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 8px 0;background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--ink-3);width:62px;font-family:var(--fd);position:relative}
.tabbar button.on{color:var(--blue)}
.tabbar button .ico{width:24px;height:24px}
.tabbar button .dot{position:absolute;top:0;right:14px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.phone-controls{margin:18px auto 0;max-width:390px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.phone-controls .chip{padding:6px 11px;font-size:12px}
.demo-bar{display:none;flex:none;align-items:center;justify-content:space-between;padding:6px 14px 6px 16px;background:var(--navy);color:#fff;font-family:var(--fd);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.demo-bar button{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.demo-bar .ico{width:14px;height:14px;stroke-width:2.6}

/* App primitives */
.sc{padding:8px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sc-head{display:flex;align-items:center;gap:10px;min-height:40px}
.sc-head h2{font-size:24px;color:var(--navy);flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);position:relative;flex:none}
.iconbtn.blue{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-2);font-size:13px}
.tiny{color:var(--ink-3);font-size:12px}
.title{font-family:var(--fd);font-weight:700;color:var(--navy)}
.h3{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--navy)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:800;color:#fff;font-size:15px;flex:none;position:relative}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:88px;height:88px;font-size:30px}
.avatar.xl{width:112px;height:112px;font-size:38px}
.av-0{background:linear-gradient(135deg,#0F6BFF,#35B6FF)}.av-1{background:linear-gradient(135deg,#07234F,#0F6BFF)}.av-2{background:linear-gradient(135deg,#1F8EF1,#7CC8FF)}.av-3{background:linear-gradient(135deg,#0A4FC2,#2BB1FF)}.av-4{background:linear-gradient(135deg,#153B7A,#3B8BFF)}
.verified{display:inline-flex;align-items:center;gap:4px;background:var(--sky);color:var(--blue);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;font-family:var(--fd)}
.verified .ico{width:13px;height:13px;stroke-width:2.6}
.stack{display:flex}
.stack .avatar{margin-left:-10px;border:2px solid var(--surface);width:30px;height:30px;font-size:11px}
.stack .avatar:first-child{margin-left:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:4px 18px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}
.scene{position:relative;overflow:hidden;background:var(--navy)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:var(--navy);font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;font-family:var(--fd);display:inline-flex;gap:5px;align-items:center}
.scene .tag.dark{background:rgba(7,35,79,.75);color:#fff}
.act-card{display:flex;flex-direction:column}
.act-card .scene{height:140px}
.act-card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.act-mini{width:230px}
.act-mini .scene{height:120px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:700}
.pill.blue{background:var(--sky);color:var(--blue)}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--ink-2);font-family:var(--fd);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.search{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-size:14px}
.progress{height:6px;border-radius:999px;background:var(--sky-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.list{display:flex;flex-direction:column}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:30;animation:toastIn .3s ease}
.toast .ico{color:var(--sea)}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.4;background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--blue);color:var(--on-blue);border-color:var(--blue);align-self:flex-end;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.bub .who{display:block;font-size:11px;font-weight:800;color:var(--blue);margin-bottom:2px;font-family:var(--fd)}
.bub .t{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;display:flex;gap:8px;align-items:center}
.composer .input{border-radius:999px;flex:1}
.cta-bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 0 4px}
.welcome{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--navy) 0%,var(--navy-2) 55%,var(--blue) 130%);color:#fff;padding:24px 24px 30px;position:relative;overflow:hidden}
.welcome .logo-card{background:#fff;border-radius:22px;padding:12px 16px 8px;align-self:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.welcome .logo-card svg{height:120px;aspect-ratio:822/709;width:auto;display:block}
.welcome .wordmark{color:#fff;font-size:40px}
.welcome .wordmark .apos{color:#fff}.welcome .wordmark .up{color:var(--sea)}
.welcome h1{font-size:34px;font-weight:800;margin-top:26px;letter-spacing:-.02em}
.welcome p{color:rgba(255,255,255,.78);margin-top:12px;font-size:15px}
.welcome .btn-white{background:#fff;color:var(--navy)}
.welcome .btn-glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.bigwave{position:absolute;left:-40px;right:-40px;bottom:-10px;height:200px;opacity:.25}
.stepdots{display:flex;gap:4px}
.stepdots i{height:4px;flex:1;border-radius:4px;background:var(--sky-2)}
.stepdots i.on{background:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;text-align:center;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:all .15s}
.tile .em{font-size:24px}
.tile.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.lvl{display:flex;gap:4px}
.lvl button{flex:1;font-size:11px;font-weight:700;padding:6px 4px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.lvl button.on{background:var(--blue);color:#fff}
.dispo{display:grid;grid-template-columns:52px repeat(3,1fr);gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.dispo .d{text-align:center;font-size:11px}
.dispo button{height:34px;border-radius:9px;background:var(--surface);border:1.5px solid var(--line)}
.dispo button.on{background:var(--blue);border-color:var(--blue)}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--blue)}.toggle.on::after{left:21px}
.swipe-wrap{position:relative;height:470px}
.swipe{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .35s ease,opacity .35s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe.drag{transition:none;cursor:grabbing}
.swipe.top{cursor:grab}
.swipe.back{transform:scale(.95) translateY(14px);opacity:.6;z-index:0}
.swipe.top{z-index:2}
.swipe.out-l{transform:translateX(-130%) rotate(-12deg);opacity:0}
.swipe.out-r{transform:translateX(130%) rotate(12deg);opacity:0}
.swipe .scene{height:250px}
.swipe .scene .person{position:absolute;inset:0;display:grid;place-items:center}
.swipe .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.score{position:absolute;right:12px;top:12px;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--sea) calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center}
